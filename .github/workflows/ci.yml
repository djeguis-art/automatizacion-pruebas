name: Integracion Continua

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas JUnit y BDD
        run: mvn --batch-mode clean test surefire-report:report-only

      - name: Publicar reporte JUnit
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas-junit
          path: target/reports/surefire.html
          if-no-files-found: error

      - name: Publicar reporte BDD Cucumber
        uses: actions/upload-artifact@v7
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-report.html
          if-no-files-found: error

      - name: Configurar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar prueba de performance con k6
        run: k6 run --summary-export=target/k6-summary.json performance/login-performance.js

      - name: Publicar resultados de performance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-performance-k6
          path: target/k6-summary.json
          if-no-files-found: warn

      - name: Generar dashboard de metricas
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          ruta = "target/k6-summary.json"

          if os.path.exists(ruta):
              with open(ruta, encoding="utf-8") as f:
                  data = json.load(f)

              metrics = data.get("metrics", {})
          reqs = metrics.get("http_reqs", {})
              duration = metrics.get("http_req_duration", {})
              failed = metrics.get("http_req_failed", {})

              tps = reqs.get("rate", 0)
              promedio = duration.get("avg", 0)
              p95 = duration.get("p(95)", 0)
              errores = failed.get("value", 0) * 100

          else:
              tps = promedio = p95 = errores = 0

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# Dashboard de Calidad\n\n")
              f.write("## Pruebas funcionales\n\n")
              f.write("| Indicador | Resultado |\n")
              f.write("|---|---|\n")
              f.write("| JUnit + BDD | Ejecutadas |\n")
              f.write("| Pipeline | Completado |\n\n")

              f.write("## Performance k6\n\n")
              f.write("| Métrica | Resultado |\n")
              f.write("|---|---:|\n")
              f.write(f"| Solicitudes por segundo (TPS aprox.) | {tps:.2f} |\n")
              f.write(f"| Latencia promedio | {promedio:.2f} ms |\n")
              f.write(f"| Latencia p95 | {p95:.2f} ms |\n")
              f.write(f"| Porcentaje de errores | {errores:.2f}% |\n")
          PY
