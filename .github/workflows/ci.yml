name: Integracion Continua

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build-and-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v6

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas JUnit y BDD
        run: mvn --batch-mode clean test surefire-report:report-only

      - name: Publicar reporte JUnit
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas-junit
          path: target/reports/surefire.html
          if-no-files-found: error

      - name: Publicar reporte BDD Cucumber
        uses: actions/upload-artifact@v7
        with:
          name: reporte-bdd-cucumber
          path: target/cucumber-report.html
          if-no-files-found: error

      - name: Configurar k6
        uses: grafana/setup-k6-action@v1

      - name: Ejecutar prueba de performance con k6
        run: k6 run --summary-export=target/k6-summary.json performance/login-performance.js

      - name: Publicar resultados de performance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-performance-k6
          path: target/k6-summary.json
          if-no-files-found: warn